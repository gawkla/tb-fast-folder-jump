name: JavaScript checks
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check background.js
      - run: node --check api/implementation.js
      - run: node tests/smoke.cjs
      - run: node tests/exclude.cjs
      - run: python3 tools/build_xpi.py
